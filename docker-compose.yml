# Entorno local completo: app + PostgreSQL
# Uso: cp .env.example .env  (y edita los valores)  ->  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nomina
      POSTGRES_USER: nomina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomina -d nomina"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://nomina:${POSTGRES_PASSWORD}@db:5432/nomina
      DATABASE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (mínimo 32 caracteres)}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nomina.co}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env}
      SEED_DEMO: ${SEED_DEMO:-true}
    ports:
      - "3000:3000"

volumes:
  pgdata:
